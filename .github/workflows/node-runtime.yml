name: Node runtime validation

on:
  pull_request:
    paths:
      - '.node-version'
      - 'package*.json'
      - 'apps/web/package.json'
      - 'packages/*/package.json'
      - 'Dockerfile'
      - '.github/workflows/node-runtime.yml'

permissions:
  contents: read

jobs:
  alpine-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare checked-in quest fixture for offline image QA
        run: |
          printf 'globalThis.fetch = async () => { throw new Error("Offline quest fixture QA"); };\n' > qa-offline-fetch.mjs
          python3 - <<'PY'
          from pathlib import Path
          source = Path('Dockerfile').read_text()
          original = 'RUN npm run sync:crafted-spells && npm run build'
          replacement = 'RUN node --import ./qa-offline-fetch.mjs scripts/sync-crafted-spells.mjs && npm run build'
          assert source.count(original) == 1
          Path('Dockerfile.qa').write_text(source.replace(original, replacement))
          PY
      - run: docker build --file Dockerfile.qa --tag node-runtime-qa .
      - name: Verify standalone runtime version
        run: docker run --rm --entrypoint node node-runtime-qa --version | grep -Fx "v$(cat .node-version)"
